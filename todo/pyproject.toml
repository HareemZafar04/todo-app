[project]
name = "evolution-of-todo"
version = "0.1.0"
description = "Phase I: Python Console Todo Application"
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://github.com/example/evolution-of-todo"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[scripts]
todo = "main:main"
